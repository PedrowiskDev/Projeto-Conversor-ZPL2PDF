services:
  zpl2pdf-api:
    image: brunoleocam/zpl2pdf:latest
    container_name: zpl2pdf-api
    # O binário ZPL2PDF é o ENTRYPOINT da imagem.
    # Passamos os argumentos via "command:" (equivale ao CMD do Docker).
    entrypoint: ["/app/ZPL2PDF"]
    command: ["--api", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - ./watch:/app/watch
      - ./output:/app/output
    environment:
      - ZPL2PDF_LANGUAGE=pt-BR
    restart: unless-stopped

  zpl2pdf-ui:
    image: nginx:alpine
    container_name: zpl2pdf-ui
    ports:
      - "8080:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - zpl2pdf-api
    restart: unless-stopped
